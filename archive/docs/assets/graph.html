*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",Arial,sans-serif;background:#f8fafc;color:#20394c}header{padding:24px 30px 18px;background:#fff;border-bottom:1px solid #d9e3ec}h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#526a7e;max-width:1000px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 30px;background:#fff;border-bottom:1px solid #d9e3ec}button,select{font:inherit;border:1px solid #bdcfdd;border-radius:8px;background:#fff;color:#20394c;padding:8px 12px;cursor:pointer}button:hover{background:#eaf2f8}button:focus-visible,select:focus-visible,.node:focus-visible{outline:3px solid #167db5;outline-offset:3px}select{max-width:340px}a{color:#166597}.layout{display:grid;grid-template-columns:minmax(0,1fr) 345px;min-height:calc(100vh - 210px)}.viewport{overflow:auto;padding:14px 12px 28px;max-height:calc(100vh - 190px)}.viewport svg{display:block;max-width:none;height:auto;margin:auto}.node{cursor:pointer;transition:opacity .15s}.edge{transition:opacity .15s}.node:hover rect{stroke:#147eaf;stroke-width:3}.node.selected rect{fill:#dceffa;stroke:#1275a2;stroke-width:3}.node.dim{opacity:.13}.edge.dim{opacity:.055}.edge.active{stroke:#147fa9;stroke-opacity:1;stroke-width:2.6}.panel{padding:24px;border-left:1px solid #d9e3ec;background:#fff;overflow:auto;max-height:calc(100vh - 190px)}.panel h2{font-size:22px;margin:0 0 12px}.panel h3{font-size:16px;margin:24px 0 10px}.panel p{color:#526a7e}.panel ul{padding:0;list-style:none}.panel li{margin:0 0 15px}.panel li p{margin:5px 0 0;font-size:14px}.panel li button{padding:4px 9px;text-align:left}.small{font-size:14px;color:#526a7e}.doclink{display:inline-block;margin:12px 0;font-weight:600}.hint{border-top:1px solid #d9e3ec;padding-top:16px;margin-top:24px}label{display:flex;align-items:center;gap:8px}input[type=range]{width:110px}@media(max-width:850px){.layout{grid-template-columns:1fr}.viewport{max-height:65vh}.panel{max-height:none;border-left:0;border-top:1px solid # </style></head><body><header><h1>Граф фич мода</h1><p>Один фундамент, все остальные узлы — фичи. Стрелка A → B: B использует решения A. Выберите узел, чтобы увидеть его прямые зависимости.</p></header><div class="toolbar"><label for="choose">Фича <select id="choose"><option value="">Весь граф</option></select></label><button id="reset">Показать весь граф</button><label for="zoom">Масштаб <input type="range" id="zoom" min="60" max="180" value="100"><span id="zoomValue">100%</span></label><a href="../README.md">Документация</a></div><main class="layout"><div class="viewport" id="viewport"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="group" aria-label="Граф зависимостей фич"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a8598"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g class="edges">

<path class="edge" data-from="foundation" data-to="container" d="M 640 103 C 640 140 100 140 100 225 C 100 310 430 300 430 347" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Фундамент → Контейнеры мода: Знакомые шкафы и кейсы, переносное хранение, полезность без настройки.</title></path>
<path class="edge" data-from="menu" data-to="container" d="M 430 263 C 430 305 430 305 430 347" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Единое меню хранения → Контейнеры мода: Контейнер использует единое меню для взаимодействия. Вместимость и фильтры задаются контейнером и отображаются через меню.</title></path>

<path class="edge" data-from="foundation" data-to="automation" d="M 640 103 C 640 140 1240 120 1240 225 L 1240 430 C 1240 485 1090 480 1090 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Фундамент → Автосортировка: Выключена по умолчанию, запускается командой или включённым режимом.</title></path>

</g></svg></div><aside class="panel" id="detail" aria-live="polite"></aside></main><script>
const data=[{"id":"foundation","title":"Фундамент","file":"../foundation.md","parents":[],"status":"Основные принципы согласованы."},{"id":"menu","title":"Единое меню хранения","file":"../features/storage-menu/README.md","parents":[["foundation","Сохраняет привычные слоты и даёт единый способ видеть запас и работать с ним. Работает на ванильных хранилищах без контейнеров мода."]],"status":"Единая фича и группировка приняты; контексты шкафа и контейнера описаны внутри. Детали UI обсуждаются."},{"id":"container","title":"Контейнеры мода","file":"../features/container/README.md","parents":[["foundation","Знакомые шкафы и кейсы, переносное хранение, полезность без настройки."],["menu","Контейнер использует единое меню для взаимодействия. Вместимость и фильтры задаются контейнером и отображаются через меню."]],"status":"базовые правила приняты; полный сценарий и детали UI прорабатываются."},{"id":"specializations","title":"Специализированные контейнеры","file":"../features/specializations/README.md","parents":[["container","Использует базовую модель размещения и хранения. Предлагает большую вместимость за ограниченный набор предметов. Перемещение образцов соблюдает общие правила; результаты исследования требуют отдельного решения."],["menu","Использует общее меню и его группировку по ванильной совместимости стека; сведения об образцах генов уточняются для конкретного типа."]],"status":"исходный замысел; набор типов и бонусы ещё обсуждаются."},{"id":"progression","title":"Грейды и качество","file":"../features/progression/README.md","parents":[["container","Улучшается существующий контейнер с сохранением его содержимого. Грейд определяет максимальную вместимость."]],"status":"обсуждение."},{"id":"automation","title":"Автосортировка","file":"../features/automation/README.md","parents":[["foundation","Выключена по умолчанию, запускается командой или включённым режимом."],["container","Учитывает свободную ёмкость наших контейнеров; ванильные кейсы проверяются по своим правилам. Перемещает допустимую часть, оставляет остаток в источнике. Фильтры контейнера: Кандидат должен разрешать приём предмета."]],"status":"опциональность принята; предложен базовый алгоритм."},{"id":"bots","title":"Поддержка ботов","file":"../features/bots/README.md","parents":[["container","Боты должны работать с новыми хранилищами; конкретное поведение ещё проектируется. Требуется согласовать получение и помещение вещей ботами с правилами переноса. Фильтры контейнера: Предлагаемое поведение учитывает правила пользователя."]],"status":"обсуждение."},{"id":"search","title":"Поиск по подлодке","file":"../features/submarine-search/README.md","parents":[["foundation","Позволяет находить запасы; область поиска и возможность удалённых действий ещё открыты."]],"status":"обсуждение."}];
const nodesById=new Map(data.map(n=>[n.id,n]));const select=document.querySelector('#choose');const detail=document.querySelector('#detail');const viewport=document.querySelector('#viewport');const svg=viewport.querySelector('svg');const slider=document.querySelector('#zoom');let chosen='';
for(const n of data){const option=document.createElement('option');option.value=n.id;option.textContent=n.title;select.append(option);}
function el(tag,text,cls){const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(cls)element.className=cls;return element;}
function relationList(title,rows){detail.append(el('h3',title));if(!rows.length){detail.append(el('p',title==='Родители'?'Нет: это корень графа.':'Пока не выделены.'));return;}const list=el('ul');for(const [id,reason]of rows){const item=el('li');const button=el('button',nodesById.get(id).title);button.addEventListener('click',()=>show(id));item.append(button,el('p',reason));list.append(item);}detail.append(list);}
function show(id){chosen=id;select.value=id;const n=nodesById.get(id);const children=n?data.filter(c=>c.parents.some(([p])=>p===id)):[];const related=new Set(n?[id,...n.parents.map(([p])=>p),...children.map(c=>c.id)]:data.map(c=>c.id));for(const element of svg.querySelectorAll('.node')){element.classList.toggle('dim',!!n&&!related.has(element.dataset.id));element.classList.toggle('selected',element.dataset.id===id);}for(const edge of svg.querySelectorAll('.edge')){const active=!!n&&(edge.dataset.from===id||edge.dataset.to===id);edge.classList.toggle('active',active);edge.classList.toggle('dim',!!n&&!active);}detail.replaceChildren();if(!n){detail.append(el('h2','Фундамент и 7 фич'),el('p','В графе 10 прямых зависимостей. Фичи не разделены на зоны или классы.'),el('p','Нажмите на фичу в графе или выберите её в списке. Здесь появятся родители, причины зависимостей и дочерние фичи.'),el('p','Зависимость описывает дизайн. Она не означает обязательного присутствия предмета в игре или очередности реализации.','hint small'));return;}detail.append(el('h2',n.title),el('p',n.status,'small'));const link=el('a','Открыть описание фичи','doclink');link.href=n.file;if(n.id==='foundation')link.textContent='Открыть фундамент';detail.append(link);relationList('Родители',n.parents);relationList('Дочерние фичи',children.map(c=>[c.id,c.parents.find(([p])=>p===id)[1]]));detail.append(el('p','Подсвечены только прямые связи выбранного узла. Нажмите на родителя или потомка, чтобы продолжить путь.','hint small'));}
for(const element of svg.querySelectorAll('.node')){element.addEventListener('click',()=>show(element.dataset.id));element.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(element.dataset.id);}});}select.addEventListener('change',()=>show(select.value));document.querySelector('#reset').addEventListener('click',()=>show(''));function resize(){const factor=Number(slider.value)/100;svg.style.width=Math.max(600,viewport.clientWidth-24)*factor+'px';document.querySelector('#zoomValue').textContent=slider.value+'%';}slider.addEventListener('input',resize);window.addEventListener('resize',resize);show('');resize();
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-label="Граф зависимостей фич"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a8598"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g class="edges">
<path class="edge" data-from="foundation" data-to="menu" d="M 640 103 C 640 145 430 145 430 187" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Фундамент → Единое меню хранения: Сохраняет привычные слоты и даёт единый способ видеть запас и работать с ним. Работает на ванильных хранилищах без контейнеров мода.</title></path>
<path class="edge" data-from="foundation" data-to="container" d="M 640 103 C 640 140 100 140 100 225 C 100 310 430 300 430 347" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Фундамент → Контейнеры мода: Знакомые шкафы и кейсы, переносное хранение, полезность без настройки.</title></path>
<path class="edge" data-from="menu" data-to="container" d="M 430 263 C 430 305 430 305 430 347" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Единое меню хранения → Контейнеры мода: Контейнер использует единое меню для взаимодействия. Вместимость и фильтры задаются контейнером и отображаются через меню.</title></path>
<path class="edge" data-from="container" data-to="specializations" d="M 430 423 C 430 475 190 475 190 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Контейнеры мода → Специализированные контейнеры: Использует базовую модель размещения и хранения. Предлагает большую вместимость за ограниченный набор предметов. Перемещение образцов соблюдает общие правила; результаты исследования требуют отдельного решения.</title></path>
<path class="edge" data-from="menu" data-to="specializations" d="M 430 263 C 430 300 170 285 170 385 C 170 465 190 465 190 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Единое меню хранения → Специализированные контейнеры: Использует общее меню и его группировку по ванильной совместимости стека; сведения об образцах генов уточняются для конкретного типа.</title></path>
<path class="edge" data-from="container" data-to="progression" d="M 430 423 C 430 475 490 475 490 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Контейнеры мода → Грейды и качество: Улучшается существующий контейнер с сохранением его содержимого. Грейд определяет максимальную вместимость.</title></path>
<path class="edge" data-from="foundation" data-to="automation" d="M 640 103 C 640 140 1240 120 1240 225 L 1240 430 C 1240 485 1090 480 1090 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Фундамент → Автосортировка: Выключена по умолчанию, запускается командой или включённым режимом.</title></path>
<path class="edge" data-from="container" data-to="automation" d="M 430 423 C 430 475 1090 475 1090 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Контейнеры мода → Автосортировка: Учитывает свободную ёмкость наших контейнеров; ванильные кейсы проверяются по своим правилам. Перемещает допустимую часть, оставляет остаток в источнике. Фильтры контейнера: Кандидат должен разрешать приём предмета.</title></path>
<path class="edge" data-from="container" data-to="bots" d="M 430 423 C 430 475 790 475 790 527" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Контейнеры мода → Поддержка ботов: Боты должны работать с новыми хранилищами; конкретное поведение ещё проектируется. Требуется согласовать получение и помещение вещей ботами с правилами переноса. Фильтры контейнера: Предлагаемое поведение учитывает правила пользователя.</title></path>
<path class="edge" data-from="foundation" data-to="search" d="M 640 103 C 640 145 1040 145 1040 187" fill="none" stroke="#6a8598" stroke-opacity=".6" stroke-width="1.8" marker-end="url(#arrow)"><title>Фундамент → Поиск по подлодке: Позволяет находить запасы; область поиска и возможность удалённых действий ещё открыты.</title></path>
</g><g class="nodes">
<g class="node" data-id="foundation" role="button" tabindex="0" aria-label="Фундамент"><title>Фундамент</title><rect x="515" y="27" width="250" height="76" rx="13" fill="#d9eee5" stroke="#559d7e" stroke-width="1.8"/><text x="640" y="65" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Фундамент</text></g>

<g class="node" data-id="container" role="button" tabindex="0" aria-label="Контейнеры мода"><title>Контейнеры мода</title><rect x="305" y="347" width="250" height="76" rx="13" fill="#ffffff" stroke="#819eb5" stroke-width="1.8"/><text x="430" y="385" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Контейнеры мода</text></g>
<g class="node" data-id="specializations" role="button" tabindex="0" aria-label="Специализированные контейнеры"><title>Специализированные контейнеры</title><rect x="65" y="527" width="250" height="76" rx="13" fill="#ffffff" stroke="#819eb5" stroke-width="1.8"/><text x="190" y="552.5" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Специализированные</text><text x="190" y="577.5" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">контейнеры</text></g>
<g class="node" data-id="progression" role="button" tabindex="0" aria-label="Грейды и качество"><title>Грейды и качество</title><rect x="365" y="527" width="250" height="76" rx="13" fill="#ffffff" stroke="#819eb5" stroke-width="1.8"/><text x="490" y="565" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Грейды и качество</text></g>
<g class="node" data-id="automation" role="button" tabindex="0" aria-label="Автосортировка"><title>Автосортировка</title><rect x="965" y="527" width="250" height="76" rx="13" fill="#ffffff" stroke="#819eb5" stroke-width="1.8"/><text x="1090" y="565" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Автосортировка</text></g>
<g class="node" data-id="bots" role="button" tabindex="0" aria-label="Поддержка ботов"><title>Поддержка ботов</title><rect x="665" y="527" width="250" height="76" rx="13" fill="#ffffff" stroke="#819eb5" stroke-width="1.8"/><text x="790" y="565" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Поддержка ботов</text></g>
<g class="node" data-id="search" role="button" tabindex="0" aria-label="Поиск по подлодке"><title>Поиск по подлодке</title><rect x="915" y="187" width="250" height="76" rx="13" fill="#ffffff" stroke="#819eb5" stroke-width="1.8"/><text x="1040" y="225" dominant-baseline="central" text-anchor="middle" fill="#20394c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Поиск по подлодке</text></g>
</g></svg>